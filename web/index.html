<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <!-- Type system: Space Grotesk (display) + IBM Plex Mono (instrument readouts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded asynchronously. As a plain stylesheet this blocks first paint on a round trip
         to fonts.googleapis.com, so a slow or unreachable Google Fonts leaves the page blank
         before the map even starts loading. `display=swap` already paints fallback text
         first, so promoting the sheet on load costs nothing visually. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="preload"
      as="style"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <title>Research Atlas — a map of CS/AI research</title>
  </head>
  <body>
    <!-- Static boot loader.
         The app bundle is ~329 KB gzipped; until it has downloaded, parsed and mounted, an
         empty #root paints as a blank window with nothing to say it is working. On a ~1 MB/s
         link that is a second or more of apparent nothing before React's own progress panel
         can exist. This markup needs no JS, no CSS request and no font, so it is on screen as
         soon as the HTML is; React replaces it when it mounts. Colours are --void/--faint from
         styles.css, hard-coded because the stylesheet may not have arrived either. -->
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
                  background:#07090d;color:#8b93a7;font:14px/1.5 system-ui,sans-serif">
        <div style="text-align:center">
          <div style="width:34px;height:34px;margin:0 auto 14px;border:2px solid #1c2230;
                      border-top-color:#8b93a7;border-radius:50%;animation:ra-spin 0.9s linear infinite"></div>
          Starting Research Atlas…
        </div>
      </div>
    </div>
    <style>@keyframes ra-spin{to{transform:rotate(360deg)}}</style>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
