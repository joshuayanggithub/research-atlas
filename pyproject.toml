[project]
name = "research-visualizer-pipeline"
version = "0.1.0"
description = "Offline pipeline that turns arXiv/OpenAlex works into a static semantic-map artifact bundle."
requires-python = ">=3.11,<3.13"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.3",
    "polars>=1.0",
    "pyarrow>=16.0",
    "numpy>=1.26,<2.2",
    "scikit-learn>=1.4",
    "opentsne>=1.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.36",
    "hnswlib>=0.8.0",
    "networkx>=3.2",
    "leidenalg>=0.10",
    "igraph>=0.11",
    "tqdm>=4.66",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
# Local embedding backend (heavy: pulls torch). Install with: uv sync --extra local-embed
local-embed = [
    "adapters>=1.2",
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
# Keep the heavy local-embed extra opt-in so the default env installs fast.
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]
pythonpath = ["."]
