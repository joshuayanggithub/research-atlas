# Build the app and deploy it to GitHub Pages.
#
# Only the APP ships here — the artifact bundle does not. web/public/data is gitignored
# (1,221 files, 0.79 GB) and two of its files exceed GitHub's 100 MB per-file hard limit, so
# the browser fetches artifacts from an object store instead. That origin is a single
# environment variable, VITE_DATA_BASE, set from the repository variable of the same name;
# publish the bundle there with tools/publish_artifacts.sh.
#
# If VITE_DATA_BASE is unset the build still succeeds and falls back to a relative "data"
# path, which 404s on Pages. That is deliberate: a missing variable should be obvious in the
# browser, not silently produce a site that looks fine but has no data.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let a newer commit supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npx vite build
        env:
          VITE_DATA_BASE: ${{ vars.VITE_DATA_BASE }}
      - name: Fail if artifacts were bundled by accident
        # web/public is copied verbatim into dist. If someone un-ignores the bundle, this
        # catches it before a 0.79 GB upload rather than after.
        run: |
          if [ -d dist/data ] && [ "$(find dist/data -type f | wc -l)" -gt 1 ]; then
            echo "dist/data contains $(find dist/data -type f | wc -l) files; artifacts must be"
            echo "published to the object store, not to Pages."
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
