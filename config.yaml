# Research Visualizer — single source of truth for the offline pipeline.
# Pipeline stages read from here. See pipeline/config.py for the typed loader.

schema_version: 3

corpus:
  # Weekly Cornell/Kaggle bulk metadata, then nightly OAI-PMH upserts. This is the
  # comprehensive 2025+2026 arXiv CS/stat.ML corpus and does not use per-paper API calls.
  source: "arxiv_snapshot"
  # OpenAlex-only controls are retained below so switching `source` stays a config change.
  field_id: "fields/17"
  # arXiv selection uses the first-version timestamp, not the id's encoded month.
  date_from: "2025-01-01"
  date_to: "2026-12-31"
  # Corpus scope. "field" = the WHOLE CS field with a citation floor, NO org fetch-gate, so
  # any influential paper appears regardless of author affiliation (the org list below then
  # only drives UI filters). "orgs" = the previous affiliation-gated behavior.
  scope: "field"
  # field scope: keep works cited > min_citations across the full range, OR published since
  # recent_since with cited > recent_min_citations (a light floor so recent work appears
  # without pulling the ~1.5M uncited papers from the last two years).
  #   cited>25 (2015+) ~= 388k  +  recent 2025+ cited>2 ~= 81k  ->  ~400-420k after dedup.
  min_citations: 25
  recent_since: "2025-01-01"
  recent_min_citations: 2
  # Hard cap over the union of the two field-scope streams (safety bound on corpus size).
  max_works: 450000
  # Per-request page size for OpenAlex cursor pagination (max 200).
  per_page: 200
  # Starter organizations (a few named orgs). Each maps to one or more OpenAlex
  # institution ids (companies fragment into regional entities; universities are single).
  # `ids` are pinned + verified against the live API — s00 fetches their display metadata.
  # If `ids` is empty, s00 falls back to resolving `search` (top relevance hit).
  # `name` is the human label shown in the UI's org filter.
  # NOTE on industry labs: OpenAlex indexes them unevenly, because their papers often go to
  # arXiv with no consistent institutional affiliation. Verified CS-2015+ counts at the time
  # of writing: Google US 13,723 | Amazon US 3,998 | Nvidia US 1,805 | AI2 683 | OpenAI 235.
  # Anthropic exists in OpenAlex (I4387930290) with **0 works**, so pinning it adds nothing;
  # likewise there is no distinct "Meta AI"/FAIR entity — FAIR work sits under Meta. Deepseek
  # /Kimi/Minimax/Redwood have no usable OpenAlex institution. Covering those labs properly
  # needs an arXiv-first ingest path, not another id here (see docs/ROADMAP.md).
  orgs:
    - key: "google"
      name: "Google"
      kind: "industry"
      search: "Google"
      # Google's PARENT entity was previously missing entirely, which is why "Attention Is
      # All You Need" (W2626778328, Google US) could not appear at all. Regional entities
      # are separate institutions in OpenAlex and must each be listed.
      ids: ["I1291425158", "I4210113297", "I4210100430", "I4210117425", "I4210148186"]
    - key: "deepmind"
      name: "Google DeepMind"
      kind: "industry"
      search: "Google DeepMind"
      ids: ["I4210090411"]
    - key: "amazon"
      name: "Amazon"
      kind: "industry"
      search: "Amazon"
      # Amazon US + DE + UK. Excludes same-named unrelated orgs (University of the Amazon,
      # Amazon Research Foundation BR) that a `search` fallback would wrongly resolve.
      ids: ["I1311688040", "I4210089985", "I4210123934"]
    - key: "openai"
      name: "OpenAI"
      kind: "industry"
      search: "OpenAI"
      ids: ["I4210161460"]
    - key: "nvidia"
      name: "NVIDIA"
      kind: "industry"
      search: "NVIDIA"
      ids: ["I4210127875", "I1304085615"]
    - key: "ai2"
      name: "Allen Institute for AI"
      kind: "industry"
      search: "Allen Institute for Artificial Intelligence"
      ids: ["I4210156221"]
    - key: "meta"
      name: "Meta"
      kind: "industry"
      search: "Meta"
      ids: ["I4210114444", "I2252078561"]        # Meta US + Meta IL
    - key: "msr"
      name: "Microsoft Research"
      kind: "industry"
      search: "Microsoft Research"
      ids: ["I4210164937", "I4210113369", "I4210124949", "I4400600948", "I4401726785"]
    - key: "berkeley"
      name: "UC Berkeley"
      kind: "university"
      search: "University of California, Berkeley"
      ids: ["I95457486"]
    - key: "cmu"
      name: "Carnegie Mellon University"
      kind: "university"
      search: "Carnegie Mellon University"
      ids: ["I74973139"]
    - key: "stanford"
      name: "Stanford University"
      kind: "university"
      search: "Stanford University"
      ids: ["I97018004"]
    - key: "mit"
      name: "MIT"
      kind: "university"
      search: "Massachusetts Institute of Technology"
      ids: ["I63966007"]

arxiv:
  snapshot_path: "data/raw/arxiv-metadata-oai-snapshot.json"
  snapshot_updated_through: "2026-08-08"
  category_prefixes: ["cs."]
  categories: ["stat.ML"]
  oai_enabled: true
  oai_base_url: "https://export.arxiv.org/oai2"
  oai_request_delay: 3.0
  oai_timeout: 120.0

# Exact-id metadata enrichment layered onto the arXiv corpus. This never discovers or drops
# papers: arXiv remains authoritative for identity, title, abstract, v1 date, versions, and
# categories. OpenAlex supplies structured author/institution ids, affiliation evidence,
# venue/DOI gaps, topics, and secondary citation/reference provenance.
openalex_enrichment:
  enabled: true
  batch_size: 100
  workers: 12
  require_api_key: true
  request_delay: 0.02
  refresh_days: 30
  max_papers: 0

# Semantic Scholar is an optional bulk reconciliation source. The normal s16 path uses the
# already-completed OpenAlex crosswalk instantly; invoke s16_enrich_s2_citations explicitly
# only for a full S2AG scan, which is paced by the key's 1 request/second API limit.
semantic_scholar_citations:
  enabled: false
  release: "latest"
  resolve_batch_size: 500
  min_request_interval: 1.1
  max_retries: 8
  download_timeout: 120.0
  max_citation_shards: 0

embedding:
  # backend: "specter2_s2" (fetch precomputed 768-dim from Semantic Scholar)
  #       or "specter2_local" (official proximity adapter, complete local coverage)
  #       or "scincl_local" (different local model/space via sentence-transformers).
  backend: "specter2_local"
  dim: 768
  specter2_model: "allenai/specter2_base"
  specter2_adapter: "allenai/specter2"
  # Benchmarked on the local RTX 3090: 128 sustains ~450 papers/s at fp16.
  local_batch_size: 128
  local_device: "auto"
  local_precision: "auto"
  checkpoint_every: 2048
  scincl_model: "malteos/scincl"
  # Semantic Scholar batch size (max 500 ids/POST).
  s2_batch_size: 500
  # How to handle papers S2 has no SPECTER2 vector for (specter2_s2 backend only):
  #   "drop"       -> keep only papers with a real SPECTER2 vector (one clean space).
  #   "fill_local" -> embed the rest with SciNCL (100% coverage, but mixes two spaces
  #                   which shows as an artificial "island" on the map).
  on_uncovered: "drop"
  # In fill_local mode, if S2 coverage is below this, re-embed the WHOLE corpus locally
  # (avoids mixing spaces at scale). Ignored in drop mode.
  s2_min_coverage: 0.5

projector:
  method: "opentsne"          # "opentsne" | "umap"
  n_neighbors: 10             # uniform-affinity kNN (PubMed-landscape recipe)
  # learning rate uses n/12 when null; early-exaggeration annealing handled in s04.
  learning_rate: null
  random_state: 42
  # Sustained exaggeration (>1) separates topic clusters into distinct islands with
  # whitespace between them, so the zoomed-out home view is less crowded. 1.0 = plain t-SNE.
  exaggeration: 1.5

cluster:
  method: "hdbscan"           # "hdbscan" | "hkmeans"
  umap_components: 10         # clustering substrate dimensionality (NOT the 2D layout)
  umap_n_neighbors: 30
  umap_min_dist: 0.0
  hdbscan_min_cluster_size: 40
  hdbscan_min_samples: 10
  random_state: 42

hierarchy:
  # Semantic-zoom regions are nested Leiden communities over the PLANAR substrate: the
  # adjacency is the 2D layout's kNN graph, the edge weights are 768-D embedding cosine.
  # Regions are therefore contiguous on screen by construction (~1-2 fragments each)
  # instead of scattered across the map (~122 fragments/region under the previous fused
  # 768-D + citation graph), and topic purity is HIGHER, not lower (band 0: 0.19 -> 0.31).
  # Resolution is bisected to hit the requested child count. See s06's docstring.
  # Comparison methods: "leiden"/"louvain" (fused 768-D + citation graph) |
  # "kmeans" (2D spatial) | "quadtree" (fixed 2D grid).
  method: "planar"
  # Spatial degree of the planar graph (2D kNN). Higher = smoother, larger regions.
  planar_k: 15
  # Number of semantic-zoom bands (band 0 = coarsest "continents"). Deep bands name
  # micro-clusters of a handful of papers at maximum zoom (see s07 leaf naming).
  max_depth: 11
  # Band 0 splits the map into this many regions; each deeper band multiplies by `branching`.
  root_clusters: 8
  branching: 3
  # A region only subdivides further if it has at least this many papers. Kept low so the
  # deepest bands can resolve micro-clusters; leaf naming (s07) handles tiny groups.
  min_cluster_size: 8
  # Minimum papers for a region to earn a label at its band (leaf micro-clusters).
  min_tile_points: 3
  # Max labels emitted per band (frontend declutter trims further per viewport). Deeper
  # bands have many small regions, so allow more candidates before the CPU declutter.
  # Raised from 320: bands 4-10 each had MORE regions than that, so ~1250 of band 7's
  # 1574 regions were silently unlabeled — deep zoom showed points with no topic name.
  max_labels_per_level: 2000
  # Minimum weight assigned to an intra-corpus direct citation in the community graph.
  direct_citation_weight: 0.45
  # A highly lopsided graph partition cannot provide useful finer zoom. In that case,
  # split the parent in embedding space while preserving strict parent membership.
  max_child_fraction: 0.68

fused:
  # related-works similarity = alpha * cosine(text) + (1 - alpha) * citation score.
  # Candidates are the union of semantic kNN, direct citations, shared references, and
  # co-citations; the multipliers cap the two broad candidate pools before final ranking.
  alpha: 0.6
  knn_k: 15
  text_candidate_multiplier: 4
  citation_candidate_multiplier: 4

labels:
  ctfidf_candidates: 12       # ranked phrases scanned before falling back to a unigram
  ngram_max: 4                # up to 4-grams (e.g. "action-conditioned world models")
  ctfidf_min_gram: 2          # prefer multi-word phrases over bare words at fine bands
  use_abstract: true          # mine label vocabulary from title+abstract, not title only

palette:
  # deck.gl background + default point styling; per-field hues assigned in s07/colors.ts.
  # Matches the "void" chart backdrop (#07090d) so the canvas and chrome share one night.
  background: [7, 9, 13]
